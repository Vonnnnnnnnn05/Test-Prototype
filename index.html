<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ICT Operations & Service Tracking System</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>
  
  <!-- Custom Colors -->
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#14532D',
            primaryHover: '#166534',
            accent: '#2563EB',
            success: '#059669',
            danger: '#DC2626',
            base: '#F5F7FA'
          }
        }
      }
    }
  </script>
  
  <style>
    .gradient-bg {
      background: linear-gradient(135deg, #14532D 0%, #166534 50%, #059669 100%);
    }
  </style>
</head>
<body class="bg-base min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="flex justify-center mb-4">
        <img src="logo.png" alt="ICT System Logo" class="w-20 h-20 object-contain">
      </div>
      <h1 class="text-3xl font-bold text-primary mb-2">ICT Operations & Service Tracking System</h1>
    </div>
    
    <div class="bg-white rounded-xl shadow-2xl p-8 login-card">
      <form id="loginForm" class="space-y-5">
        <div>
          <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
              <i data-feather="mail" class="w-5 h-5"></i>
            </span>
            <input type="email" name="email" id="email" placeholder="Enter your email" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition">
          </div>
        </div>
        
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-gray-400">
              <i data-feather="lock" class="w-5 h-5"></i>
            </span>
            <input type="password" name="password" id="password" placeholder="Enter your password" class="w-full pl-10 pr-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition">
          </div>
        </div>
        
        <div class="flex items-center justify-between">
          <label class="flex items-center">
            <input type="checkbox" class="w-4 h-4 text-primary border-gray-300 rounded focus:ring-primary">
            <span class="ml-2 text-sm text-gray-600">Remember me</span>
          </label>
          <a href="#" class="text-sm text-accent hover:underline">Forgot password?</a>
        </div>
        
        <button type="submit" class="w-full bg-primary hover:bg-primaryHover text-white py-3 rounded-lg font-medium transition transform hover:scale-[1.02] active:scale-[0.98] shadow-md hover:shadow-lg">
          Login
        </button>
      </form>
      
      <div class="mt-6 text-center">
        <p class="text-sm text-gray-600">
          Don't have an account? <a href="#" class="text-accent hover:underline font-medium">Register here</a>
        </p>
      </div>
    </div>
    
    <div class="mt-8 text-center">
      <p class="text-sm text-gray-500"> 2026 ICT Operations & Service Tracking System</p>
    </div>
  </div>
  
  <script>
    feather.replace();
    
    // Check if user is already logged in
    if (localStorage.getItem('userLoggedIn') === 'true') {
      const userRole = localStorage.getItem('userRole');
      redirectBasedOnRole(userRole);
    }
    
    // Login form submission
    document.getElementById('loginForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      
      // Admin credentials
      if (email === 'admin@test.com' && password === 'admin123') {
        localStorage.setItem('userLoggedIn', 'true');
        localStorage.setItem('userEmail', email);
        localStorage.setItem('userRole', 'admin');
        window.alert('Welcome Test Admin')
        window.location.href = 'admin/dashboard.php';
      }
      // OJT credentials
      else if (email === 'ojt@test.com' && password === 'ojt123') {
        localStorage.setItem('userLoggedIn', 'true');
        localStorage.setItem('userEmail', email);
        localStorage.setItem('userRole', 'ojt');
        window.alert('Welcome Test OJT')
        window.location.href = 'ojt/dashboard.php';
      }
      // Staff credentials
      else if (email === 'staff@test.com' && password === 'staff123') {
        localStorage.setItem('userLoggedIn', 'true');
        localStorage.setItem('userEmail', email);
        localStorage.setItem('userRole', 'staff');
        window.alert('Welcome Test Staff')
        window.location.href = 'staff/dashboard.php';
      }
      // Technician credentials
      else if (email === 'technician@test.com' && password === 'technician123') {
        localStorage.setItem('userLoggedIn', 'true');
        localStorage.setItem('userEmail', email);
        localStorage.setItem('userRole', 'technician');
        window.alert('Welcome Test Technician')
        window.location.href = 'technician/dashboard.php';
      }
      else {
        alert('Invalid email or password!');
      }
    });
    
    function redirectBasedOnRole(role) {
      const dashboards = {
        'admin': 'admin/dashboard.php',
        'ojt': 'ojt/dashboard.php',
        'staff': 'staff/dashboard.php',
        'technician': 'technician/dashboard.php'
      };
      
      if (dashboards[role]) {
        window.location.href = dashboards[role];
      }
    }
  </script>
</body>
</html>
